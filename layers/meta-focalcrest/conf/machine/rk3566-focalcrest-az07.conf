require conf/machine/include/focalcrest-rk3566.inc

MACHINEOVERRIDES =. "az07:"

KERNEL_DEVICETREE = "rockchip/rk3566-focalcrest-az07.dtb"

KBUILD_DEFCONFIG = ""

UBOOT_MACHINE = "rk3566-focalcrest-az07_defconfig"

UBOOT_EXTLINUX = "0"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "u-boot-extlinux"

UBOOT_ENTRYPOINT  = "0x02000000"
UBOOT_LOADADDRESS = "0x02000000"

IMAGE_BOOT_FILES = "fitImage;kernel.fit"

MACHINE_FEATURES:append = " wifi bluetooth"

MACHINE_EXTRA_RRECOMMENDS += "firmware-ap6256"
